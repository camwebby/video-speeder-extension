<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Speeder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell" aria-label="Video Speeder controls">
      <section class="card">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true">➜</div>
          <div>
            <h1>VIDEO SPEEDER</h1>
            <p id="pageStatus">Per-tab media speed</p>
          </div>
        </header>

        <div class="mode-toggle" role="tablist" aria-label="Speed scope">
          <button id="tabModeButton" class="mode-button active" type="button">This tab</button>
          <button id="allModeButton" class="mode-button" type="button">All tabs</button>
        </div>

        <div class="speed-stage">
          <output id="speedBubble" class="speed-bubble" for="speedSlider">1.00x</output>

          <div class="slider-row">
            <button id="minusButton" class="icon-button" type="button" aria-label="Decrease speed">−</button>
            <input
              id="speedSlider"
              class="speed-slider"
              type="range"
              min="0.25"
              max="4"
              step="0.01"
              value="1"
              aria-label="Playback speed"
            />
            <button id="plusButton" class="icon-button" type="button" aria-label="Increase speed">+</button>
          </div>
        </div>

        <div class="quick-row" aria-label="Quick speed presets">
          <button class="preset-button" type="button" data-speed="0.5">0.5x</button>
          <button class="preset-button" type="button" data-speed="1">1x</button>
          <button class="preset-button" type="button" data-speed="1.25">1.25x</button>
          <button class="preset-button" type="button" data-speed="1.5">1.5x</button>
          <button class="preset-button" type="button" data-speed="2">2x</button>
        </div>

        <footer class="footer">
          <button id="resetButton" class="reset-button" type="button">RESET</button>
        </footer>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
